<h1>2026 年第一季度报告</h1>
<p>本公司及董事会全体成员保证信息披露内容的真实、准确、完整。</p>
<p>一季度实现营业收入 15.20 亿元，同比增长 18.3%；归属于母公司股东的净利润 2.80 亿元，同比增长 12.4%。</p>
<p>经营活动产生的现金流量净额为 1.05 亿元，同比下降 6.2%。</p>
<p>报告期：2026 年 1 月 1 日至 2026 年 3 月 31 日。公告日期：2026-04-24。</p>
