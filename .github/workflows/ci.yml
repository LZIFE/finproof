name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Engine regression tests (finproof_calc)
        run: python3 -m pytest finproof-verifier/skills/finproof-verification/bin/test_finproof_calc.py -q
      - name: Package consistency checks (check_package.py)
        run: python3 finproof-verifier/check_package.py
      - name: Citation authenticity suite (12/12 expected)
        run: python3 evaluation/cite_suite/run_cite_suite.py
      - name: Backend tolerance alignment tests
        run: |
          cd backend
          python3 -m pytest tests/test_financial_value.py -q
