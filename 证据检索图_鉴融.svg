<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 402" width="100%" role="img">
<title>证据检索：混合检索与证据门</title>
<desc>结构化主张经四路召回、统一重排、证据门过滤，输出带页码的 Top-N 证据候选块。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A" font-family="sans-serif">证据检索：混合检索 + 证据门</text>

<rect x="190" y="50" width="300" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">输入：结构化主张</text>
<text x="340" y="84" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">指标 + 期间 + 口径 + 数值</text>

<line x1="340" y1="98" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="118" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">BM25</text>
<text x="110" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">关键词：指标词+数值</text>

<rect x="190" y="118" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="260" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">向量检索</text>
<text x="260" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">语义近邻</text>

<rect x="340" y="118" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="410" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">规则召回</text>
<text x="410" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">公司+指标+期间</text>

<rect x="490" y="118" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="560" y="136" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">财务指标索引</text>
<text x="560" y="158" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">结构化财务事实</text>

<line x1="340" y1="174" x2="340" y2="196" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="196" width="300" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">统一重排 rerank</text>

<line x1="340" y1="240" x2="340" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="140" y="258" width="400" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806" font-family="sans-serif">证据门 Evidence Gate</text>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B" font-family="sans-serif">strict scope 归因 · 主表利润严格恢复</text>

<line x1="340" y1="314" x2="340" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="334" width="300" height="48" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">输出：Top-N 证据候选块</text>
<text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5" font-family="sans-serif">带页码 · 提交版默认 Top3</text>
</svg>
